<!--
  TOOLKIT DE COLLABS · framework de aplicação
  Douglas R. Bocalão · MPA FGV EAESP · orientador Prof. Dr. Felipe Zambaldi

  Conteúdo das etapas: Quadro 5 da dissertação. Citações: Capítulo 4.
  Arquivo único, sem dependência externa. Abre com duplo clique.

  DOIS TIPOS DE LINK, PROPOSITALMENTE SEPARADOS:
    "exemplos de mercado" em cada ferramenta  -> acréscimo de apoio, NÃO citado na pesquisa
    "materiais"                               -> seus documentos internos (slots vazios)

  PARA ADICIONAR SEUS LINKS: procure  "#"  na lista "mats" de cada etapa, na
  constante DATA abaixo. Os slots que continuarem com "#" aparecem como pendentes.
-->
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    color-scheme: light dark;
    --s1:#5B4BE3; --s2:#4E63E6; --s3:#2E7FE6; --s4:#0E9BC9; --s5:#0FAF9E;
    --mo:#6C4FE0; --dc:#0E9BC9;
    --ink:#12162a; --ink2:#4c5474; --ink3:#767ea0;
    --bg:#f4f5fb; --card:#ffffff; --soft:#eceffa; --line:#e0e4f2; --hair:#edf0f9;
    --hd1:#171a2f; --hd2:#2a2350;
    --sh: 0 1px 2px rgba(18,22,42,.05), 0 8px 24px rgba(18,22,42,.07);
    --a: var(--s1);
    --r: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --s1:#8578F5; --s2:#7189F5; --s3:#4E9BF0; --s4:#26B4DE; --s5:#1FC9B4;
      --mo:#9A85F2; --dc:#26B4DE;
      --ink:#eaedf9; --ink2:#a9b1d0; --ink3:#7f88ab;
      --bg:#0a0d1a; --card:#131728; --soft:#1a1f36; --line:#252b45; --hair:#1e2338;
      --hd1:#0f1223; --hd2:#1d1938;
      --sh: 0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"] {
    --s1:#8578F5; --s2:#7189F5; --s3:#4E9BF0; --s4:#26B4DE; --s5:#1FC9B4;
    --mo:#9A85F2; --dc:#26B4DE;
    --ink:#eaedf9; --ink2:#a9b1d0; --ink3:#7f88ab;
    --bg:#0a0d1a; --card:#131728; --soft:#1a1f36; --line:#252b45; --hair:#1e2338;
    --hd1:#0f1223; --hd2:#1d1938;
    --sh: 0 1px 2px rgba(0,0,0,.45), 0 10px 28px rgba(0,0,0,.3);
  }
  :root[data-theme="light"] {
    --s1:#5B4BE3; --s2:#4E63E6; --s3:#2E7FE6; --s4:#0E9BC9; --s5:#0FAF9E;
    --mo:#6C4FE0; --dc:#0E9BC9;
    --ink:#12162a; --ink2:#4c5474; --ink3:#767ea0;
    --bg:#f4f5fb; --card:#ffffff; --soft:#eceffa; --line:#e0e4f2; --hair:#edf0f9;
    --hd1:#171a2f; --hd2:#2a2350;
    --sh: 0 1px 2px rgba(18,22,42,.05), 0 8px 24px rgba(18,22,42,.07);
  }

  body { font: 400 15px/1.5 "Helvetica Neue", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  ::selection { background: color-mix(in srgb, var(--a) 30%, transparent); }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 0 26px; }

  /* ================================================================== header */
  .hd { background: linear-gradient(104deg, var(--hd1), var(--hd2)); color: #fff; }
  .hd .wrap { display: flex; align-items: center; gap: 14px; height: 66px; }
  .mark { width: 30px; height: 30px; border-radius: 9px; flex: 0 0 auto;
    background: linear-gradient(135deg, #7C5CFF, #12C8CB); box-shadow: 0 4px 14px rgba(70,60,220,.45); }
  .hd h1 { font-size: 19.5px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }
  .hd h1 s { text-decoration: none; font-size: 12px; font-weight: 500; color: #a9aede; letter-spacing: 0; }
  .sp { flex: 1; }
  .hprog { display: flex; align-items: center; gap: 9px; font-size: 11.5px; color: #a9aede; }
  .hprog b { color: #fff; font-variant-numeric: tabular-nums; }
  .hbar { width: 92px; height: 5px; border-radius: 99px; background: rgba(255,255,255,.16); overflow: hidden; }
  .hbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #7C5CFF, #12C8CB); transition: width .35s; }
  .hb { font: inherit; font-size: 12px; font-weight: 600; color: #d6d9f5; background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.16); border-radius: 8px; padding: 6px 11px; cursor: pointer; transition: .15s; }
  .hb:hover { background: rgba(255,255,255,.16); color: #fff; }
  .hb:focus-visible, .seg:focus-visible, summary:focus-visible, .cl input:focus-visible,
  .pg button:focus-visible, .card5:focus-visible { outline: 2px solid #12C8CB; outline-offset: 2px; }

  /* ==================================================================== flow */
  .flowbar { position: sticky; top: 0; z-index: 40; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: saturate(180%) blur(12px); border-bottom: 1px solid var(--line); }
  .flow { display: flex; align-items: stretch; gap: 7px; padding: 9px 0; }
  .seg { position: relative; flex: 1 1 0; min-width: 0; text-align: left; font: inherit; cursor: pointer;
    border: 1px solid color-mix(in srgb, var(--c) 26%, var(--line));
    background: color-mix(in srgb, var(--c) 7%, var(--card)); border-radius: 10px; padding: 8px 26px 9px 10px;
    display: grid; grid-template-columns: 22px 1fr; gap: 9px; align-items: center; transition: .16s; overflow: hidden; }
  .seg:hover { background: color-mix(in srgb, var(--c) 14%, var(--card)); transform: translateY(-1px); }
  .seg[aria-current="true"] { background: color-mix(in srgb, var(--c) 15%, var(--card));
    border-color: var(--c); box-shadow: 0 0 0 2px color-mix(in srgb, var(--c) 22%, transparent); }
  .seg .n { width: 22px; height: 22px; border-radius: 7px; display: grid; place-items: center; color: #fff;
    font-size: 11px; font-weight: 800; background: var(--c); }
  .seg > span { min-width: 0; }
  .seg .nm { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 11.5px; font-weight: 700; line-height: 1.22; color: var(--ink); }
  .seg .cp { display: block; font-size: 10px; font-weight: 600; margin-top: 1px;
    color: color-mix(in srgb, var(--c) 78%, var(--ink3)); }
  .seg .tick { position: absolute; right: 7px; top: 7px; width: 15px; height: 15px; border-radius: 50%;
    background: var(--c); display: none; }
  .seg .tick::after { content:""; position:absolute; left:5px; top:3.5px; width:4px; height:7px;
    border:1.8px solid #fff; border-top:0; border-left:0; transform: rotate(40deg); }
  .seg.done .tick { display: block; }
  .seg .fill { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--c); transition: width .35s; }
  .seg.home { flex: 0 0 96px; grid-template-columns: 1fr; --c: var(--ink3); padding-right: 10px; }
  .seg.home .nm { white-space: normal; }

  /* ==================================================================== view */
  main { padding: 26px 0 70px; }
  .view { display: none; }
  .view.on { display: block; }

  /* ------------------------------------------------------------------ home */
  .lede { font-size: 17px; line-height: 1.55; color: var(--ink2); max-width: 74ch; }
  .h2 { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--ink3); }
  h2.big { font-size: 27px; font-weight: 800; letter-spacing: -.022em; line-height: 1.14; max-width: 30ch; }
  h2.big em { font-style: normal; background: linear-gradient(96deg, var(--mo), var(--dc));
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  .block { margin-top: 30px; }
  .defbox { margin-top: 20px; border-radius: var(--r); padding: 18px 20px; color: #fff;
    background: linear-gradient(104deg, var(--hd1), var(--hd2)); font-size: 14.5px; line-height: 1.55; box-shadow: var(--sh); }
  .defbox b { color: #b9b1ff; }

  .steps3 { margin-top: 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .u { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 15px 16px; }
  .u .i { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; color: #fff;
    font-size: 11.5px; font-weight: 800; background: linear-gradient(135deg, var(--mo), var(--dc)); }
  .u p { margin-top: 9px; font-size: 13.5px; line-height: 1.5; color: var(--ink2); }

  .cards5 { margin-top: 14px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; }
  .card5 { position: relative; text-align: left; font: inherit; cursor: pointer; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--r); padding: 16px 15px 15px; transition: .18s;
    box-shadow: var(--sh); overflow: hidden; }
  .card5::before { content:""; position: absolute; inset: 0 0 auto 0; height: 4px;
    background: linear-gradient(90deg, var(--c), color-mix(in srgb, var(--c) 45%, #ffffff)); }
  .card5:hover { transform: translateY(-3px); border-color: color-mix(in srgb, var(--c) 55%, var(--line)); }
  .card5 .n { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 8px; color: #fff;
    font-size: 12.5px; font-weight: 800; background: var(--c); }
  .card5 h3 { margin-top: 11px; font-size: 14px; font-weight: 750; line-height: 1.22; }
  .card5 .cp { margin-top: 4px; font-size: 10.5px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; color: var(--c); }
  .card5 p { margin-top: 8px; font-size: 12.5px; line-height: 1.45; color: var(--ink2); }
  .card5 .mini { margin-top: 12px; height: 3px; border-radius: 99px; background: var(--soft); overflow: hidden; }
  .card5 .mini i { display: block; height: 100%; width: 0; background: var(--c); transition: width .35s; }

  .lens { margin-top: 14px; display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .lensbox { background: var(--card); border: 1px solid var(--line); border-top: 3px solid var(--c);
    border-radius: var(--r); padding: 17px 18px; }
  .lensbox .k { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; color: var(--c); }
  .lensbox h3 { margin-top: 7px; font-size: 16px; font-weight: 750; }
  .lensbox p { margin-top: 8px; font-size: 13.5px; line-height: 1.5; color: var(--ink2); }
  .refs { margin-top: 12px; display: grid; gap: 6px; }
  .refs a { display: flex; gap: 8px; align-items: baseline; font-size: 12.5px; line-height: 1.4;
    text-decoration: none; color: var(--ink2); padding: 8px 10px; border-radius: 8px;
    background: color-mix(in srgb, var(--c) 8%, transparent);
    border: 1px solid color-mix(in srgb, var(--c) 20%, transparent); transition: .15s; }
  .refs a:hover { background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--ink); }
  .refs a b { color: var(--c); font-weight: 750; white-space: nowrap; }
  .refs a .ex { margin-left: auto; padding-left: 6px; font-size: 10px; color: var(--ink3); white-space: nowrap; }

  .csf3 { margin-top: 14px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .csf3 .u { border-left: 3px solid var(--c); }
  .csf3 h3 { font-size: 14.5px; font-weight: 750; }

  .trio { margin-top: 11px; display: grid; gap: 5px; }
  .trio div { position: relative; padding-left: 13px; font-size: 12.5px; line-height: 1.4; color: var(--ink2); }
  .trio div::before { content:""; position:absolute; left:0; top:6px; width:6px; height:6px; border-radius:2px; background: var(--c); }
  .trio b { color: var(--ink); font-weight: 750; }

  .note { margin-top: 8px; font-size: 13.5px; line-height: 1.5; color: var(--ink2); max-width: 80ch; }
  .mxwrap { overflow-x: auto; margin-top: 13px; }
  table.mx { border-collapse: separate; border-spacing: 4px; width: 100%; }
  table.mx th.rh { text-align: left; white-space: nowrap; padding: 8px 11px; border-radius: 7px;
    font-size: 11.5px; font-weight: 750; color: #fff; }
  table.mx th.rh.mo { background: var(--mo); }
  table.mx th.rh.dc { background: var(--dc); }
  table.mx thead th { padding: 5px 8px 9px; text-align: center; min-width: 104px;
    font-size: 10.5px; font-weight: 750; line-height: 1.25; color: var(--ink2); }
  table.mx thead th b { display: block; font-size: 12px; color: var(--c); }
  table.mx td { text-align: center; padding: 9px 6px; background: var(--card);
    border: 1px solid var(--line); border-radius: 7px; }
  table.mx td i, .mxleg i.dot { display: inline-block; border-radius: 50%; }
  .d2 { width: 11px; height: 11px; }
  .d1 { width: 8px; height: 8px; opacity: .42; }
  .mxleg { margin-top: 11px; display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    font-size: 11.5px; color: var(--ink3); }
  .mxleg span { display: flex; align-items: center; gap: 6px; }
  .mxleg i.sw { width: 10px; height: 10px; border-radius: 3px; }

  .lensline { margin-top: 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 11px 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink3); }
  .lensline .lb { font-size: 10px; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
  .lensline .cx { font-weight: 750; padding: 2px 8px; border-radius: 6px; color: #fff; }
  .lensline .cx.mo { background: var(--mo); }
  .lensline .cx.dc { background: var(--dc); }
  .lensline em { font-style: normal; color: var(--ink2); margin-right: 8px; }
  .lensline .lk { margin-left: auto; font: inherit; font-size: 12px; font-weight: 650; color: var(--a);
    background: transparent; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }

  .fine { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 12px; line-height: 1.6; color: var(--ink3); }
  .fine b { color: var(--ink2); }

  /* ----------------------------------------------------------------- stage */
  .hero { position: relative; border-radius: 14px; padding: 20px 24px 22px 26px; overflow: hidden;
    background: linear-gradient(100deg, color-mix(in srgb, var(--a) 14%, var(--card)),
                                        color-mix(in srgb, var(--a) 4%, var(--card)));
    border: 1px solid color-mix(in srgb, var(--a) 26%, var(--line)); }
  .hero::before { content:""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--a); }
  .hrow { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }
  .eta { font-size: 10.5px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #fff;
    background: var(--a); padding: 3px 8px; border-radius: 6px; }
  .tag { font-size: 10.5px; font-weight: 750; padding: 3px 8px; border-radius: 6px; color: #fff; }
  .tag.mo { background: var(--mo); }
  .tag.dc { background: var(--dc); }
  .hero h2 { margin-top: 11px; font-size: 26px; font-weight: 800; letter-spacing: -.022em; line-height: 1.12; }
  .hero .foco { margin-top: 9px; font-size: 16px; line-height: 1.4; font-weight: 650; max-width: 62ch; }
  .hero .ten { margin-top: 9px; font-size: 13px; line-height: 1.5; color: var(--ink2); max-width: 72ch;
    padding-left: 11px; border-left: 2px solid color-mix(in srgb, var(--a) 45%, transparent); }

  .acc { margin-top: 14px; display: grid; gap: 8px; }
  details { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
  details[open] { border-color: color-mix(in srgb, var(--a) 34%, var(--line)); box-shadow: var(--sh); }
  summary { display: flex; align-items: center; gap: 11px; padding: 13px 15px; cursor: pointer;
    list-style: none; transition: background .14s; }
  summary::-webkit-details-marker { display: none; }
  summary::marker { content: ""; }
  summary:hover { background: color-mix(in srgb, var(--a) 5%, transparent); }
  details[open] summary { background: color-mix(in srgb, var(--a) 8%, transparent);
    border-bottom: 1px solid color-mix(in srgb, var(--a) 20%, var(--hair)); }
  summary .ic { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 7px; flex: 0 0 auto;
    background: color-mix(in srgb, var(--a) 15%, transparent); color: var(--a); font-size: 11.5px; font-weight: 800; }
  details[open] summary .ic { background: var(--a); color: #fff; }
  summary .tt { font-size: 14.5px; font-weight: 700; }
  summary .ct { font-size: 10.5px; font-weight: 750; color: var(--a); font-variant-numeric: tabular-nums;
    background: color-mix(in srgb, var(--a) 12%, transparent); border-radius: 99px; padding: 2px 8px; }
  summary .cv { margin-left: auto; display: grid; place-items: center; width: 24px; height: 24px; flex: 0 0 auto;
    border-radius: 7px; font-size: 13px; line-height: 1; color: var(--ink3);
    background: color-mix(in srgb, var(--a) 9%, transparent); transition: .18s; }
  summary:hover .cv { background: color-mix(in srgb, var(--a) 18%, transparent); color: var(--a); }
  details[open] summary .cv { transform: rotate(180deg); color: var(--a);
    background: color-mix(in srgb, var(--a) 16%, transparent); }
  .bd { padding: 16px 16px 18px 50px; }
  @media (max-width: 700px) { .bd { padding-left: 16px; } }
  .bd p { font-size: 14.5px; line-height: 1.6; color: var(--ink2); max-width: 70ch; }
  .bd p + p { margin-top: 9px; }
  .bd p strong { color: var(--ink); font-weight: 700; }

  ol.how { list-style: none; counter-reset: f; display: grid; gap: 9px; }
  ol.how li { counter-increment: f; position: relative; padding-left: 30px; font-size: 14.5px; line-height: 1.5;
    color: var(--ink2); max-width: 70ch; }
  ol.how li::before { content: counter(f); position: absolute; left: 0; top: 1px; display: grid; place-items: center;
    width: 20px; height: 20px; border-radius: 6px; background: var(--a); color: #fff; font-size: 11px; font-weight: 800; }

  .areas { display: grid; gap: 9px; }
  .area { display: grid; grid-template-columns: 190px 1fr; gap: 14px; align-items: baseline;
    padding: 9px 12px; border-radius: 9px; background: var(--soft); }
  .area b { font-size: 13.5px; font-weight: 750; }
  .area .ld { display: inline-block; margin-left: 6px; font-size: 9px; font-weight: 800; letter-spacing: .05em;
    text-transform: uppercase; color: #fff; background: var(--a); border-radius: 4px; padding: 2px 5px; vertical-align: 1.5px; }
  .area span { font-size: 13px; line-height: 1.45; color: var(--ink2); }
  @media (max-width: 700px) { .area { grid-template-columns: 1fr; gap: 3px; } }

  .tools { display: grid; gap: 11px; }
  .tool { padding: 12px 14px; border-radius: 10px; background: var(--soft); border-left: 3px solid var(--a); }
  .tool b { font-size: 13.5px; font-weight: 750; }
  .tool span { display: block; font-size: 13px; line-height: 1.45; color: var(--ink2); margin-top: 2px; }
  .mk { margin-top: 9px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .mk .lb { font-size: 10px; font-weight: 750; letter-spacing: .04em; text-transform: uppercase; color: var(--ink3); }
  .mk a { font-size: 11.5px; font-weight: 650; text-decoration: none; color: var(--a); padding: 3px 9px;
    border-radius: 99px; background: color-mix(in srgb, var(--a) 11%, transparent);
    border: 1px solid color-mix(in srgb, var(--a) 24%, transparent); transition: .14s; }
  .mk a:hover { background: var(--a); color: #fff; border-color: var(--a); }

  .mats { display: grid; gap: 7px; }
  .mats a, .mats span.slot { display: flex; align-items: center; gap: 9px; font-size: 13.5px; padding: 11px 13px;
    border: 1px solid var(--line); border-radius: 9px; text-decoration: none; color: var(--ink); transition: .15s; }
  .mats a:hover { border-color: var(--a); background: color-mix(in srgb, var(--a) 7%, transparent); }
  .mats span.slot { color: var(--ink3); border-style: dashed; }
  .mats .tagr { margin-left: auto; padding-left: 8px; font-size: 9.5px; font-weight: 800; letter-spacing: .05em;
    text-transform: uppercase; color: var(--ink3); white-space: nowrap; }

  .quotes { display: grid; gap: 13px; }
  blockquote { padding: 12px 15px; border-radius: 10px; background: var(--soft);
    border-left: 3px solid color-mix(in srgb, var(--a) 70%, transparent); }

/* =================================================================== logic */
function show(v, push) {
  const id = v === "home" ? "home" : String(v);
  const el = document.getElementById("v-" + id);
  if (!el) return show("home", push);
  document.querySelectorAll(".view").forEach(x => x.classList.remove("on"));
  el.classList.add("on");
  document.querySelectorAll(".seg").forEach(b => b.setAttribute("aria-current", b.dataset.v === id));
  if (push) history.replaceState(null, "", id === "home" ? "#inicio" : "#etapa-" + id);
  state.last = id; save();
  window.scrollTo({ top: 0, behavior: "instant" });
}

function refresh() {
  let done = 0;
  DATA.forEach(s => {
    const n = nDone(s), pct = n / s.check.length;
    done += n;
    document.querySelector(`[data-count="${s.id}"]`).textContent = n + "/" + s.check.length;
    document.querySelector(`[data-bar="${s.id}"]`).style.width = pct * 100 + "%";
    document.querySelector(`[data-card="${s.id}"]`).style.width = pct * 100 + "%";
    document.querySelector(`[data-fill="${s.id}"]`).style.width = pct * 100 + "%";
    document.getElementById("seg-" + s.id).classList.toggle("done", pct === 1);
  });
  document.getElementById("hn").textContent = done + "/" + TOTAL;
  document.getElementById("hb").style.width = 100 * done / TOTAL + "%";
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-v]");
  if (b) show(b.dataset.v === "home" ? "home" : +b.dataset.v, true);
});
document.getElementById("main").addEventListener("change", e => {
  const c = e.target;
  if (c.matches('input[type="checkbox"]')) {
    state[c.dataset.s + "." + c.dataset.j] = c.checked; save(); refresh();
  }
});
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea")) return;
  const cur = state.last === "home" ? 0 : +state.last;
  if (/^[1-5]$/.test(e.key)) show(+e.key, true);
  else if (e.key === "0" || e.key === "h") show("home", true);
  else if (e.key === "ArrowRight" && cur < 5) show(cur + 1, true);
  else if (e.key === "ArrowLeft" && cur > 1) show(cur - 1, true);
});

document.getElementById("bPr").onclick = () => window.print();
window.addEventListener("beforeprint", () => {
  document.querySelectorAll("details").forEach(d => { d.dataset.was = d.open ? "1" : ""; d.open = true; });
});
window.addEventListener("afterprint", () => {
  document.querySelectorAll("details").forEach(d => { d.open = d.dataset.was === "1"; });
});
document.getElementById("bTh").onclick = () => {
  const now = document.documentElement.getAttribute("data-theme");
  const next = now === "dark" ? "light" : now === "light" ? "" : "dark";
  next ? document.documentElement.setAttribute("data-theme", next)
       : document.documentElement.removeAttribute("data-theme");
  state.theme = next; save();
};
document.getElementById("bExp").onclick = () => {
  const L = ["# Checklist de aplicação de collab", ""];

    L.push("## Etapa " + s.id + " · " + s.nome, "_Avança quando: " + s.gate + "_", "");
    s.check.forEach((c, j) => L.push((state[s.id + "." + j] ? "- [x] " : "- [ ] ") + c));
    L.push("");
  });
  L.push("Fonte: Quadro 5 da dissertação de Douglas R. Bocalão · MPA FGV EAESP.");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([L.join("\n")], { type: "text/markdown" }));
  a.download = "checklist-collab.md"; a.click(); URL.revokeObjectURL(a.href);
};

if (state.theme) document.documentElement.setAttribute("data-theme", state.theme);
const h = location.hash;
show(/etapa-([1-5])/.test(h) ? +h.match(/etapa-([1-5])/)[1] : (h === "#inicio" ? "home" : (state.last || "home")), false);
refresh();
