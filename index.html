<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%235B4BE3%27/%3E%3Ccircle cx=%2738%27 cy=%2750%27 r=%2718%27 fill=%27none%27 stroke=%27white%27 stroke-width=%278%27/%3E%3Ccircle cx=%2762%27 cy=%2750%27 r=%2718%27 fill=%27none%27 stroke=%27white%27 stroke-width=%278%27/%3E%3C/svg%3E">
<title>Toolkit de collabs</title>
<meta name="description" content="Framework de aplicação para collabs entre marcas: cinco etapas, áreas envolvidas, ferramentas, critérios de passagem e checklists.">
<meta name="author" content="Douglas R. Bocalão">
<meta property="og:type" content="website">
<meta property="og:title" content="Toolkit de collabs">
<meta property="og:description" content="Framework de aplicação para collabs entre marcas: cinco etapas, áreas envolvidas, ferramentas, critérios de passagem e checklists.">

<!--
  TOOLKIT DE COLLABS · framework de aplicação
  Douglas R. Bocalão · MPA FGV EAESP · orientador Prof. Dr. Felipe Zambaldi
  Conteúdo das etapas: Quadro 5 da dissertação.

  Arquivo único, sem dependência externa. Abre com duplo clique.
  Para adicionar materiais: procure "#" na lista "mats" de cada etapa em DATA.
  Os "exemplos de mercado" das ferramentas são acréscimo de apoio, não citados na pesquisa.
-->
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

:root{
  color-scheme:light dark;
  --s1:#5B4BE3; --s2:#4E63E6; --s3:#2E7FE6; --s4:#0E9BC9; --s5:#0FAF9E;
  --s1f:#5B4BE3; --s2f:#4E63E6; --s3f:#2A75D4; --s4f:#0B7FA5; --s5f:#0B8578;
  --s1t:#5B4BE3; --s2t:#4E63E6; --s3t:#2870CA; --s4t:#0B799D; --s5t:#0B7E72;
  --neg:#E8452C; --negf:#D53F28; --negt:#CC3D27;
  --on:#fff;
  --mo:#6C4FE0; --dc:#0E9BC9; --mot:#6C4FE0; --dct:#0B799D;
  --ink:#101329; --ink2:#545c7d; --ink3:#646c90;
  --bg:#f6f7fb; --card:#ffffff; --soft:#eef1f9; --line:#e3e7f3; --hair:#edf0f8;
  --cbline:#8590b3;
  --a:var(--s1);
  --r:16px; --r2:12px; --r3:9px;
  --sh:0 1px 2px rgba(16,19,42,.04), 0 10px 26px -18px rgba(16,19,42,.3);
  --shl:0 2px 6px rgba(16,19,42,.06), 0 24px 48px -28px rgba(16,19,42,.45);
  --top:60px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --s1:#8578F5; --s2:#7189F5; --s3:#4E9BF0; --s4:#26B4DE; --s5:#1FC9B4;
    --s1f:#8578F5; --s2f:#7189F5; --s3f:#4E9BF0; --s4f:#26B4DE; --s5f:#1FC9B4;
    --s1t:#8578F5; --s2t:#7189F5; --s3t:#4E9BF0; --s4t:#26B4DE; --s5t:#1FC9B4;
    --neg:#FF7A63; --negf:#FF7A63; --negt:#FF7A63;
    --on:#0a0d18;
    --mo:#9A85F2; --dc:#26B4DE; --mot:#9A85F2; --dct:#26B4DE;
    --ink:#e9ecf9; --ink2:#a7aecc; --ink3:#7d85a8;
    --bg:#0a0d18; --card:#131727; --soft:#1a1f33; --line:#242942; --hair:#1d2236;
    --cbline:#5a6488;
    --sh:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
    --shl:0 2px 6px rgba(0,0,0,.4), 0 24px 48px -28px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
    --s1:#8578F5; --s2:#7189F5; --s3:#4E9BF0; --s4:#26B4DE; --s5:#1FC9B4;
  --s1f:#8578F5; --s2f:#7189F5; --s3f:#4E9BF0; --s4f:#26B4DE; --s5f:#1FC9B4;
  --s1t:#8578F5; --s2t:#7189F5; --s3t:#4E9BF0; --s4t:#26B4DE; --s5t:#1FC9B4;
  --neg:#FF7A63; --negf:#FF7A63; --negt:#FF7A63;
  --on:#0a0d18;
  --mo:#9A85F2; --dc:#26B4DE; --mot:#9A85F2; --dct:#26B4DE;
  --ink:#e9ecf9; --ink2:#a7aecc; --ink3:#7d85a8;
  --bg:#0a0d18; --card:#131727; --soft:#1a1f33; --line:#242942; --hair:#1d2236;
  --cbline:#5a6488;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 10px 26px -18px rgba(0,0,0,.8);
  --shl:0 2px 6px rgba(0,0,0,.4), 0 24px 48px -28px rgba(0,0,0,.9);
}

html{scroll-behavior:smooth}
body{
  font:400 15px/1.55 "Helvetica Neue",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  color:var(--ink); background:var(--bg); -webkit-font-smoothing:antialiased;
}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
::selection{background:color-mix(in srgb,var(--a) 28%,transparent)}
:focus-visible{outline:2px solid var(--a);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ============================================================ topbar */
.hd{position:sticky;top:0;z-index:50;color:#fff;overflow:hidden;
  background:linear-gradient(102deg,#3D2BC9 0%,#5B4BE3 22%,#2E7FE6 58%,#0FAF9E 100%)}
.hd::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 200% at 8% 0%,rgba(255,255,255,.22),transparent 55%)}
.hd .wrap{position:relative;z-index:1;display:flex;align-items:center;gap:14px;height:60px}
.brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:-.025em;font-size:17px}
.brand i{width:30px;height:30px;border-radius:9px;flex:0 0 auto;position:relative;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.brand i::before,.brand i::after{content:"";position:absolute;top:8px;width:12px;height:12px;
  border:2px solid #fff;border-radius:50%}
.brand i::before{left:4px} .brand i::after{right:4px;opacity:.75}
.brand .tag{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;
  color:rgba(255,255,255,.72);border-left:1px solid rgba(255,255,255,.3);padding-left:11px;margin-left:2px}
.sp{flex:1}
.gp{display:flex;align-items:center;gap:9px;font-size:12px;color:rgba(255,255,255,.78)}
.gp b{color:#fff;font-variant-numeric:tabular-nums;font-weight:700}
.gbar{width:88px;height:6px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.gbar i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,#FFD166,#fff);transition:width .3s}
.ib{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:rgba(255,255,255,.92);
  border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.12);border-radius:9px;
  padding:7px 12px;transition:.15s;backdrop-filter:blur(4px)}
.ib:hover{background:rgba(255,255,255,.24);color:#fff;border-color:rgba(255,255,255,.6)}
.ib:focus-visible{outline-color:#fff}
@media (max-width:760px){.gp,.brand .tag{display:none}}
@media (max-width:520px){.ib.opt{display:none}}

/* ============================================================ stepper */
.stepbar{position:sticky;top:var(--top);z-index:40;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.steps{display:flex;gap:6px;padding:8px 0;overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.seg{position:relative;flex:1 1 0;min-width:132px;text-align:left;border-radius:var(--r3);
  border:1px solid var(--line);background:var(--card);padding:7px 9px;overflow:hidden;transition:.15s;
  display:grid;grid-template-columns:20px 1fr;gap:8px;align-items:center}
.seg:hover{border-color:color-mix(in srgb,var(--c) 55%,var(--line))}
.seg .n{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;
  font-size:11px;font-weight:700;color:var(--on);background:var(--cf,var(--c))}
.seg .nm{display:block;font-size:11.5px;font-weight:600;line-height:1.2;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg[aria-current="true"]{background:var(--c);border-color:var(--c);
  box-shadow:0 6px 16px -8px color-mix(in srgb,var(--c) 80%,transparent)}
.seg[aria-current="true"] .nm{color:#fff}
.seg[aria-current="true"] .n{background:rgba(255,255,255,.25);color:#fff}
.seg.home[aria-current="true"]{background:var(--ink);border-color:var(--ink)}
.seg.home[aria-current="true"] .nm{color:var(--bg)}
.seg .fill{position:absolute;left:0;bottom:0;height:2px;width:0;background:var(--c);transition:width .3s}
.seg.done .n::after{content:"";position:absolute;inset:auto auto auto auto;width:0;height:0}
.seg.done .n{background:var(--c);font-size:0}
.seg.done .n::before{content:"✓";font-size:12px;font-weight:700}
.seg.home{flex:0 0 84px;min-width:84px;grid-template-columns:1fr;--c:var(--ink3)}

/* ============================================================ views */
.view{display:none;padding:38px 0 96px;animation:fade .25s ease both}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}

h1.t{font-size:clamp(26px,3.4vw,34px);line-height:1.1;letter-spacing:-.03em;font-weight:700}
p.sub{color:var(--ink2);font-size:16px;margin-top:8px;max-width:72ch}
.lbl{display:flex;align-items:center;gap:9px;font-size:11px;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink2);margin-bottom:12px}
.lbl::before{content:"";width:22px;height:3px;border-radius:99px;background:linear-gradient(90deg,var(--s1),var(--s5))}

/* home: ações */
.cta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}
.pri{background:var(--af,var(--a));color:var(--on);font-size:14px;font-weight:600;border-radius:10px;padding:11px 18px;
  box-shadow:0 8px 20px -12px color-mix(in srgb,var(--a) 90%,transparent);transition:.15s}
.pri:hover{filter:brightness(1.07);transform:translateY(-1px)}
.gh{font-size:13px;color:var(--ink3)}
.gh b{color:var(--ink2);font-variant-numeric:tabular-nums}
.lnk{font-size:12.5px;color:var(--ink3);text-decoration:underline;text-underline-offset:3px}
.lnk:hover{color:var(--ink)}

/* home: cards de etapa */
.cards{list-style:none;display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:14px}
.cards>li{display:flex}
@media (max-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}}
@media (max-width:700px){.cards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:460px){.cards{grid-template-columns:1fr}}
.card{--c:var(--s1);position:relative;width:100%;height:100%;text-align:left;background:var(--card);
  border:1px solid var(--line);border-radius:var(--r);padding:18px 16px 14px;box-shadow:var(--sh);
  display:flex;flex-direction:column;gap:7px;transition:.18s;overflow:hidden}
.card::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:var(--c)}
.card:hover{transform:translateY(-3px);box-shadow:var(--shl);border-color:color-mix(in srgb,var(--c) 45%,var(--line))}
.card .n{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font-size:12.5px;font-weight:700;color:var(--on);background:var(--cf,var(--c))}
.card h3{font-size:15.5px;line-height:1.25;letter-spacing:-.015em;font-weight:650}
.card p{font-size:13px;color:var(--ink2);line-height:1.45;flex:1}
.card .pb{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink3);
  font-variant-numeric:tabular-nums;margin-top:4px}
.card .pb span{flex:1;height:4px;border-radius:99px;background:var(--soft);overflow:hidden}
.card .pb i{display:block;height:100%;width:0;background:var(--c);transition:width .3s}

/* referência (acordeões da home) */
.ref{margin-top:40px}
details.d{border:1px solid var(--line);background:var(--card);border-radius:var(--r2);margin-bottom:8px;overflow:hidden}
details.d[open]{box-shadow:var(--sh)}
details.d>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:11px;
  font-size:14px;font-weight:600;transition:.15s}
details.d>summary::before{content:"";width:8px;height:8px;border-radius:50%;flex:0 0 auto;background:var(--dot,var(--s3))}
details.d>summary::-webkit-details-marker{display:none}
details.d>summary:hover{background:var(--hair)}
details.d>summary .cv{margin-left:auto;color:var(--ink3);font-size:14px;line-height:1;transition:transform .2s}
details.d[open]>summary .cv{transform:rotate(180deg)}
details.d .bd{padding:2px 16px 18px;border-top:1px solid var(--hair)}
details.d .bd>*+*{margin-top:12px}
.p{font-size:14px;color:var(--ink2);line-height:1.6;max-width:76ch}
.p b,.p strong{color:var(--ink);font-weight:600}

/* trios (fatores, lentes) */
.tri{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.tri .u{--c:var(--s1);border:1px solid var(--line);border-top:3px solid var(--c);border-radius:var(--r2);
  padding:13px 14px;background:var(--bg)}
.tri .u h4{color:var(--ink)}
.tri .u h4{font-size:13.5px;font-weight:650;margin-bottom:5px}
.tri .u p{font-size:12.5px;color:var(--ink2);line-height:1.5}
.lensgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.lb{--c:var(--mo);border:1px solid var(--line);border-left:3px solid var(--c);border-radius:var(--r2);
  padding:14px 16px;background:var(--bg)}
.lb .k{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ct,var(--c));margin-bottom:6px}
.lb h4{font-size:14.5px;font-weight:650;margin-bottom:8px}
.lb .it{font-size:12.5px;color:var(--ink2);line-height:1.5}
.lb .it+.it{margin-top:6px}
.lb .it b{color:var(--ink);font-weight:600}
.refs{display:flex;flex-direction:column;gap:5px;margin-top:10px}
.refs a{font-size:11.5px;color:var(--ink3);text-decoration:none;line-height:1.4}
.refs a b{color:var(--ink2);font-weight:600}
.refs a:hover{color:var(--ink)}

/* matriz */
.mxwrap{overflow-x:auto}
.mx{border-collapse:collapse;width:100%;min-width:560px;font-size:12.5px}
.mx th,.mx td{border-bottom:1px solid var(--hair);padding:9px 8px;text-align:center}
.mx thead th{--c:var(--s1);font-size:11px;font-weight:600;color:var(--ink2);vertical-align:bottom;line-height:1.25}
.mx thead th b{display:block;color:var(--ct,var(--c));font-size:12.5px}
.mx .rh{text-align:left;font-weight:600;color:var(--ink);white-space:nowrap;padding-right:14px}
.mx .rh::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px}
.mx .rh.mo::before{background:var(--mo)} .mx .rh.dc::before{background:var(--dc)}
.mx i{display:inline-block;border-radius:50%}
.mx i.d2{width:11px;height:11px} .mx i.d1{width:11px;height:11px;opacity:.32}
.mxleg{display:flex;flex-wrap:wrap;gap:16px;margin-top:12px;font-size:11.5px;color:var(--ink3);align-items:center}
.mxleg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;background:var(--ink3)}
.mxleg i.d1{opacity:.32}

/* ============================================================ etapa */
.shead{position:relative;border-bottom:1px solid var(--line);padding-bottom:20px}
.shead::before{content:"";position:absolute;left:50%;top:-38px;width:100vw;height:230px;
  transform:translateX(-50%);z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,color-mix(in srgb,var(--a) 13%,transparent),transparent)}
.kick{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--ink3);margin-bottom:10px}
.kick .e{font-weight:700;color:var(--at,var(--a));letter-spacing:.08em;text-transform:uppercase}
.cx{font-size:11px;font-weight:600;border-radius:99px;padding:3px 9px;border:1px solid;
  color:var(--c);border-color:color-mix(in srgb,var(--c) 35%,transparent);
  background:color-mix(in srgb,var(--c) 9%,transparent)}
.cx.mo{--c:var(--mo)} .cx.dc{--c:var(--dc)}
.shead h1{font-size:clamp(24px,3.2vw,32px);line-height:1.12;letter-spacing:-.03em;font-weight:700}
.shead h1:focus{outline:none}
.t:focus{outline:none}
.shead .foco{font-size:16px;color:var(--ink2);margin-top:8px;max-width:60ch}

.acc{margin-top:22px}
.acc details{border:1px solid var(--line);background:var(--card);border-radius:var(--r2);margin-bottom:8px;overflow:hidden}
.acc details[open]{box-shadow:var(--sh)}
.acc summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:11px;padding:14px 16px;
  font-size:14.5px;font-weight:600;transition:.15s}
.acc summary::-webkit-details-marker{display:none}
.acc summary:hover{background:var(--hair)}
.acc .ic{width:23px;height:23px;flex:0 0 auto;border-radius:7px;display:grid;place-items:center;
  font-size:11.5px;font-weight:800;color:var(--on);background:var(--af,var(--a));
  box-shadow:0 4px 10px -6px color-mix(in srgb,var(--a) 90%,transparent)}
.acc .ct{margin-left:auto;font-size:11.5px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums}
.acc .cv{color:var(--ink3);font-size:14px;line-height:1;margin-left:10px;transition:transform .2s}
.acc details[open] .cv{transform:rotate(180deg)}
.acc .bd{padding:4px 16px 18px;border-top:1px solid var(--hair)}
.acc .bd>*+*{margin-top:12px}

/* texto editorial */
.lead{font-size:clamp(17px,1.5vw,20px);line-height:1.45;letter-spacing:-.017em;color:var(--ink);
  font-weight:450;max-width:62ch}
.lead strong{font-weight:700;color:var(--at,var(--a));
  background:linear-gradient(transparent 62%,color-mix(in srgb,var(--a) 22%,transparent) 0)}
.p strong,.p b{color:var(--ink);font-weight:650}
.pull{position:relative;margin-top:18px;padding:16px 18px 16px 46px;border-radius:var(--r2);
  background:color-mix(in srgb,var(--a) 7%,var(--card));
  border:1px solid color-mix(in srgb,var(--a) 22%,transparent);
  font-size:15.5px;line-height:1.45;font-weight:550;color:var(--ink);letter-spacing:-.01em}
.pull::before{content:"”";position:absolute;left:14px;top:14px;font-size:44px;line-height:.7;
  font-weight:800;color:color-mix(in srgb,var(--a) 45%,transparent)}
.pull .k{display:block;font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:var(--at,var(--a));margin-bottom:5px}
ol.how{list-style:none;counter-reset:h;display:block;margin-top:2px}
ol.how li{counter-increment:h;display:grid;grid-template-columns:46px 1fr;gap:16px;align-items:start;
  padding:15px 0;border-top:1px solid var(--hair);font-size:15px;color:var(--ink2);line-height:1.5}
ol.how li:first-child{border-top:0;padding-top:4px}
ol.how li::before{content:counter(h,decimal-leading-zero);font-size:24px;font-weight:800;line-height:1;
  letter-spacing:-.04em;color:var(--at,var(--a));opacity:.85;font-variant-numeric:tabular-nums}
ol.how li strong{color:var(--ink);font-weight:650}
.areas,.tools,.mats{display:grid;gap:9px}
.areas{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.area{border:1px solid var(--line);border-radius:var(--r3);padding:11px 13px;background:var(--bg)}
.area b{display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:650;margin-bottom:3px}
.area .ld{font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--on);
  background:var(--af,var(--a));border-radius:99px;padding:2px 8px;
  box-shadow:0 4px 10px -6px color-mix(in srgb,var(--a) 90%,transparent)}
.area{border-left:3px solid color-mix(in srgb,var(--a) 35%,var(--line))}
.area span{font-size:12.5px;color:var(--ink2);line-height:1.45}
.tools{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.tool{border:1px solid var(--line);border-radius:var(--r3);padding:11px 13px;background:var(--bg)}

  border:2px solid #fff;border-top:0;border-left:0;transform:rotate(42deg)}

  text-decoration-color:color-mix(in srgb,var(--ink3) 60%,transparent)}

@media print{

  .acc details,.card,.gate{box-shadow:none;border-color:#ddd}
}

            <li>não está previsto desenvolvimento conjunto, caso em que o instrumento tende a ser licenciamento ou patrocínio;</li>
            <li>a estrutura interna não comporta o engajamento simultâneo de marketing, jurídico, produto e operações.</li>
          </ul>
        </div>
      </div>
    </section>

  </div>

  <div class="path">
    <div class="lbl">Se a resposta for sim</div>
    <p class="p">O processo observado nas organizações estudadas se organiza em cinco etapas. Cada uma reúne o que é
      feito, como é feito, quem entra, as ferramentas, os materiais de apoio e um checklist. Ao fim de cada etapa, um
      critério de passagem indica se já dá para avançar.</p>

    <div class="cta">
      <button class="pri" id="goNext" type="button" data-v="1">Começar pela etapa 1</button>
      <span class="gh"><b id="hn2">0</b> de ${TOTAL} itens do checklist</span>
      <button class="lnk" id="bReset" type="button" hidden>limpar progresso</button>
    </div>

    <ol class="cards">
      ${DATA.map(s => `<li>
        <button class="card" style="--c:${s.cor};--cf:var(--s${s.id}f)" data-v="${s.id}" type="button">
          <span class="n">${s.id}</span>
          <h3>${esc(s.nome)}</h3>
          <p>${esc(s.foco)}</p>
          <span class="pb"><span><i data-card="${s.id}"></i></span><em data-cardn="${s.id}">0/${s.check.length}</em></span>
        </button></li>`).join("")}
    </ol>
  </div>

  <div class="ref">
    <div class="lbl">Referência</div>

    <details class="d" style="--dot:var(--s2)">
      <summary>Fatores críticos, presentes em todas as etapas<span class="cv">▾</span></summary>
      <div class="bd"><div class="tri">
        <div class="u" style="--c:var(--s1)"><h4>Fit de propósito e valores</h4><p>Pesa mais do que compatibilidade de audiência.</p></div>
        <div class="u" style="--c:var(--s3)"><h4>Autenticidade do desenvolvimento conjunto</h4><p>As duas marcas contribuem no desenvolvimento; é o que separa collab de licenciamento.</p></div>
        <div class="u" style="--c:var(--s5)"><h4>Confiança relacional</h4><p>Destrava a coordenação entre empresas autônomas e a resolução de tensões.</p></div>
      </div></div>
    </details>

    <details class="d" style="--dot:var(--s3)">
      <summary>Lentes teóricas<span class="cv">▾</span></summary>
      <div class="bd"><div class="lensgrid">
        <div class="lb" style="--c:var(--mo);--ct:var(--mot)">
          <div class="k">Market Orientation</div>
          <h4>Sentir o mercado e os parceiros</h4>
          <div class="it"><b>Geração de inteligência.</b> Captar informação sobre mercado, consumidor, concorrência e outras marcas.</div>
          <div class="it"><b>Disseminação.</b> Fazer a inteligência circular entre as áreas e entre as duas empresas.</div>
          <div class="it"><b>Responsividade.</b> Agir com base na inteligência: responder, ajustar, executar.</div>
          <div class="refs">${REFS.mo.map(r => `<a href="${r[2]}" target="_blank" rel="noopener"><b>${esc(r[0])}</b> · ${esc(r[1])}</a>`).join("")}</div>
        </div>
        <div class="lb" style="--c:var(--dc);--ct:var(--dct)">
          <div class="k">Dynamic Capabilities</div>
          <h4>Orquestrar e reconfigurar recursos</h4>
          <div class="it"><b>Sensing.</b> Detectar e moldar oportunidades e ameaças.</div>
          <div class="it"><b>Seizing.</b> Capturar a oportunidade: mobilizar recursos, decidir, estruturar.</div>
          <div class="it"><b>Transforming.</b> Reconfigurar recursos e rotinas para não enrijecer.</div>
          <div class="refs">${REFS.dc.map(r => `<a href="${r[2]}" target="_blank" rel="noopener"><b>${esc(r[0])}</b> · ${esc(r[1])}</a>`).join("")}</div>
        </div>
      </div></div>
    </details>

    <details class="d" style="--dot:var(--s4)">
      <summary>Capacidades por etapa<span class="cv">▾</span></summary>
      <div class="bd">
        <p class="p">A relação não é de um para um: a mesma capacidade atravessa mais de uma etapa, e cada etapa
          opera capacidades das duas lentes.</p>
        <div class="mxwrap"><table class="mx">
          <caption class="sr">Capacidades das duas lentes teóricas por etapa do framework</caption>
          <thead><tr><th scope="col"><span class="sr">Capacidade</span></th>
            ${DATA.map(s => `<th scope="col" style="--c:${s.cor};--ct:var(--s${s.id}t)"><b>${s.id}</b>${esc(s.nome)}</th>`).join("")}
          </tr></thead>
          <tbody>
            ${MATRIX.map(([th, nome, vals]) => `<tr>
              <th scope="row" class="rh ${th}">${esc(nome)}</th>
              ${vals.map(v => `<td>${v
                ? `<i class="${v === 2 ? "d2" : "d1"}" style="background:var(--${th})"></i><span class="sr">${v === 2 ? "dominante" : "presente"}</span>`
                : `<span class="sr">não se aplica</span>`}</td>`).join("")}
            </tr>`).join("")}
          </tbody>
        </table></div>
        <div class="mxleg">
          <span><i></i>dominante</span>
          <span><i class="d1"></i>presente</span>
          <span><i style="background:var(--mo)"></i>Market Orientation</span>
          <span><i style="background:var(--dc)"></i>Dynamic Capabilities</span>
        </div>
      </div>
    </details>

    <details class="d" style="--dot:var(--s5)">
      <summary>Fonte e limites<span class="cv">▾</span></summary>
      <div class="bd">
        <p class="p">Conteúdo das etapas: Quadro 5 e Capítulo 4 da dissertação <i>Collab de dentro para fora:
          uma investigação qualitativa sobre como são construídas as collabs entre grandes marcas no Brasil</i>.
          Douglas R. Bocalão, orientador Prof. Dr. Felipe Zambaldi, MPA FGV EAESP, 2026. Base empírica: dez
          entrevistas com executivos de marketing de organizações brasileiras (2025–2026).</p>
        <p class="p">Não é um método validado por ciclos de design, e sim a sistematização descritiva de práticas
          observadas, a ser adaptada a cada contexto. Os <b>exemplos de mercado</b> citados nas ferramentas são
          acréscimo de apoio do autor e não derivam da pesquisa.</p>
      </div>
    </details>
  </div>

  <div class="news">
    <div class="lbl">Collabs no mercado</div>
    <p class="newsnote">As ${NEWS.length} publicações mais recentes sobre collabs em Meio &amp; Mensagem e Propmark,
      levantadas em ${NEWS_DATA}. Contexto de mercado, não material da pesquisa. Abrem em nova janela.</p>
    <div class="nwgrid">
      ${NEWS.slice(0, 6).map(n => `
        <a class="nw ${n[4]}" href="${n[1]}" target="_blank" rel="noopener">
          <span class="th" data-v="${n[4] === "mm" ? "M&amp;M" : "PM"}"><img src="${n[2]}" alt="" loading="lazy" decoding="async"
            onerror="this.closest('.nw').classList.add('noimg')"></span>
          <span class="mt"><em>${n[4] === "mm" ? "Meio &amp; Mensagem" : "Propmark"}</em>
            <i>${n[3].split("-").reverse().join("/")}</i></span>
          <h4>${esc(n[0])}</h4>
        </a>`).join("")}
    </div>
    ${NEWS.length > 6 ? `<details class="nwmore">
      <summary>ver as outras ${NEWS.length - 6} publicações<span class="cv">▾</span></summary>
      <div class="nwgrid">
        ${NEWS.slice(6).map(n => `
          <a class="nw ${n[4]}" href="${n[1]}" target="_blank" rel="noopener">
            <span class="th" data-v="${n[4] === "mm" ? "M&amp;M" : "PM"}"><img src="${n[2]}" alt="" loading="lazy" decoding="async"
              onerror="this.closest('.nw').classList.add('noimg')"></span>
            <span class="mt"><em>${n[4] === "mm" ? "Meio &amp; Mensagem" : "Propmark"}</em>
              <i>${n[3].split("-").reverse().join("/")}</i></span>
            <h4>${esc(n[0])}</h4>
          </a>`).join("")}
      </div>
    </details>` : ""}
  </div>

  <p class="foot">Atalhos: <span class="kbd">1</span> a <span class="kbd">5</span> abrem as etapas,
    <span class="kbd">0</span> volta ao início, <span class="kbd">←</span> <span class="kbd">→</span> navegam.
    O checklist fica salvo apenas neste navegador.</p>
</section>`;

/* =================================================================== etapa */
const stage = s => `
<section class="view" id="v-${s.id}" style="--a:${s.cor};--af:var(--s${s.id}f);--at:var(--s${s.id}t)">
  <div class="shead">
    <div class="kick">
      <span class="e">Etapa ${s.id} de 5</span>
      ${s.cap.map(c => `<span class="cx ${c[1]}" title="${THEORY[c[1]]}">${esc(c[0].toLowerCase())}</span>`).join("")}
    </div>
    <h1 tabindex="-1">${esc(s.nome)}</h1>
    <p class="foco">${esc(s.foco)}</p>
  </div>

  <div class="acc">
    <details open>
      <summary><span class="ic">1</span>O que é feito<span class="cv">▾</span></summary>
      <div class="bd">
        <p class="lead">${s.resumo}</p>
        <p class="p">${esc(s.oque)}</p>
        <div class="pull"><span class="k">ponto de atenção</span>${esc(s.tensao)}</div>
      </div>
    </details>

    <details>
      <summary><span class="ic">2</span>Como é feito<span class="ct">${s.frentes.length}</span><span class="cv">▾</span></summary>
      <div class="bd"><ol class="how">${s.frentes.map(f => `<li>${esc(f)}</li>`).join("")}</ol></div>
    </details>

    <details>
      <summary><span class="ic">3</span>Áreas envolvidas<span class="ct">${s.quem.length}</span><span class="cv">▾</span></summary>
      <div class="bd"><div class="areas">${s.quem.map(q => `<div class="area">
        <b>${esc(q[0])}${q[2] ? '<span class="ld">lidera</span>' : ""}</b><span>${esc(q[1])}</span></div>`).join("")}</div></div>
    </details>

    <details>
      <summary><span class="ic">4</span>Ferramentas<span class="ct">${s.ferr.length}</span><span class="cv">▾</span></summary>
      <div class="bd"><div class="tools">${s.ferr.map(f => `<div class="tool">
        <b>${esc(f[0])}</b><span>${esc(f[1])}</span>
        ${f[2] && f[2].length ? `<div class="mk"><span class="k">exemplos de mercado</span>
          ${f[2].map(t => `<a href="${t[1]}" target="_blank" rel="noopener">${esc(t[0])} ↗</a>`).join("")}</div>` : ""}
        </div>`).join("")}</div></div>
    </details>

    <details>
      <summary><span class="ic">5</span>Materiais<span class="ct">${s.mats.length}</span><span class="cv">▾</span></summary>
      <div class="bd"><div class="mats">${s.mats.map(m => m[1] === "#"
        ? `<div class="slot"><b>${esc(m[0])}</b><span class="ds">${esc(m[2])}</span></div>`
        : `<a href="${esc(m[1])}" target="_blank" rel="noopener"><b>${esc(m[0])}<span class="tagr">abrir ↗</span></b>
           <span class="ds">${esc(m[2])}</span></a>`).join("")}</div></div>
    </details>

    <details>
      <summary><span class="ic">6</span>Checklist (passo a passo)<span class="ct" data-count="${s.id}">0/${s.check.length}</span><span class="cv">▾</span></summary>
      <div class="bd">
        <div class="clbar"><i data-bar="${s.id}"></i></div>
        <ul class="cl">${s.check.map((c, j) => `<li><label>
          <input type="checkbox" data-s="${s.id}" data-j="${j}" ${state[s.id + "." + j] ? "checked" : ""}>
          <span>${esc(c)}</span></label></li>`).join("")}</ul>
        <div class="clfoot"><button class="lnk" type="button" data-clear="${s.id}">desmarcar etapa</button></div>
      </div>
    </details>
  </div>

  <div class="gate" data-gate="${s.id}">
    <div class="k"><span data-gatek="${s.id}">Pronto para avançar quando</span></div>
    <div class="g">${esc(s.gate)}</div>
    <div class="s">${s.gateSrc}</div>
    <button class="pri gonext" type="button" data-v="${s.id === 5 ? "home" : s.id + 1}" data-gatego="${s.id}" hidden>
      ${s.id === 5 ? "Voltar ao início" : "Ir para a etapa " + (s.id + 1)}</button>
  </div>

  <div class="pg">
    <button class="nav" type="button" data-v="${s.id === 1 ? "home" : s.id - 1}">← ${s.id === 1 ? "Início" : "Etapa " + (s.id - 1)}</button>
    <span class="of">etapa ${s.id} de 5</span>
    <button class="nav" type="button" data-v="${s.id === 5 ? "home" : s.id + 1}">${s.id === 5 ? "Início" : "Etapa " + (s.id + 1)} →</button>
  </div>
</section>`;

document.getElementById("main").innerHTML = home + DATA.map(stage).join("");

/* =================================================================== logic */
const hashOf = id => id === "home" ? "#inicio" : "#etapa-" + id;
function parseHash() {
  const m = /^#etapa-([1-5])$/.exec(location.hash);
  if (m) return +m[1];
  return location.hash === "#inicio" ? "home" : null;
}
function show(v, mode) {
  const id = v === "home" ? "home" : String(v);
  const el = document.getElementById("v-" + id);
  if (!el) return show("home", "push");
  document.querySelectorAll(".view").forEach(x => x.classList.remove("on"));
  el.classList.add("on");
  document.querySelectorAll(".seg").forEach(b => b.setAttribute("aria-current", b.dataset.v === id));
  if (mode === "push" && location.hash !== hashOf(id)) history.pushState({ v: id }, "", hashOf(id));
  else if (mode !== "silent") history.replaceState({ v: id }, "", hashOf(id));
  state.last = id; save();
  const seg = document.querySelector(`.seg[data-v="${id}"]`);
  if (seg) seg.scrollIntoView({ block: "nearest", inline: "nearest" });
  window.scrollTo({ top: 0, behavior: "instant" });
  const hd = el.querySelector("h1");
  if (hd) { hd.setAttribute("tabindex", "-1"); hd.focus({ preventScroll: true }); }
  const live = document.getElementById("live");
  if (live) live.textContent = id === "home" ? "Início" : "Etapa " + id + " de 5, " + DATA[id - 1].nome;
}
window.addEventListener("popstate", () => { const p = parseHash(); show(p === null ? "home" : p, "silent"); });
window.addEventListener("hashchange", () => {
  const p = parseHash();
  if (p !== null) show(p, "silent"); else show("home", "replace");
});

function refresh() {
  let done = 0;
  DATA.forEach(s => {
    const n = nDone(s), pct = n / s.check.length;
    done += n;
    document.querySelector(`[data-count="${s.id}"]`).textContent = n + "/" + s.check.length;
    document.querySelector(`[data-cardn="${s.id}"]`).textContent = n + "/" + s.check.length;
    document.querySelector(`[data-bar="${s.id}"]`).style.width = pct * 100 + "%";
    document.querySelector(`[data-card="${s.id}"]`).style.width = pct * 100 + "%";
    document.querySelector(`[data-fill="${s.id}"]`).style.width = pct * 100 + "%";
    document.getElementById("seg-" + s.id).classList.toggle("done", pct === 1);
  });
  document.getElementById("hn").textContent = done + "/" + TOTAL;
  document.getElementById("hn2").textContent = done;
  document.getElementById("hb").style.width = 100 * done / TOTAL + "%";
  document.getElementById("bReset").hidden = done === 0;

  DATA.forEach(s => {
    const pronto = nDone(s) === s.check.length;
    document.querySelector(`[data-gate="${s.id}"]`).classList.toggle("ready", pronto);
    document.querySelector(`[data-gatek="${s.id}"]`).textContent =
      pronto ? "Pronto para avançar" : "Pronto para avançar quando";
    document.querySelector(`[data-gatego="${s.id}"]`).hidden = !pronto;
  });

  const tudo = done === TOTAL;
  const next = DATA.find(s => nDone(s) < s.check.length) || DATA[4];
  const btn = document.getElementById("goNext");
  btn.dataset.v = next.id;
  btn.textContent = done === 0 ? "Começar pela etapa 1"
    : tudo ? "Baixar o checklist completo" : "Continuar na etapa " + next.id;
  btn.dataset.done = tudo ? "1" : "";

  const box = document.getElementById("resume");
  box.hidden = done === 0;
  if (done > 0) {
    document.getElementById("rTit").textContent = tudo
      ? "Checklist completo, 33 de 33 itens"
      : "Você parou na etapa " + next.id + ", " + next.nome;
    document.getElementById("rSub").textContent = tudo
      ? "O aprendizado da etapa 5 realimenta a etapa 1."
      : done + " de " + TOTAL + " itens marcados";
  }
}

document.addEventListener("click", e => {
  const clr = e.target.closest("[data-clear]");
  if (clr) {
    const id = +clr.dataset.clear;
    if (!confirm("Desmarcar os itens desta etapa?")) return;
    DATA.find(s => s.id === id).check.forEach((_, j) => delete state[id + "." + j]);
    document.querySelectorAll(`input[data-s="${id}"]`).forEach(i => i.checked = false);
    save(); refresh(); return;
  }
  const b = e.target.closest("button[data-v]");
  if (b) {
    if (b.dataset.done === "1") { document.getElementById("bExp").click(); return; }
    show(b.dataset.v === "home" ? "home" : +b.dataset.v, "push");
  }
});

document.getElementById("main").addEventListener("change", e => {
  const c = e.target;
  if (c.matches('input[type="checkbox"]')) {
    state[c.dataset.s + "." + c.dataset.j] = c.checked; save(); refresh();
  }
});

document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea") || e.metaKey || e.ctrlKey) return;
  const cur = state.last === "home" ? 0 : +state.last;
  if (/^[1-5]$/.test(e.key)) show(+e.key, "push");
  else if (e.key === "0" || e.key === "h" || e.key === "Escape") show("home", "push");
  else if (e.key === "ArrowRight" && cur < 5) show(cur + 1, "push");
  else if (e.key === "ArrowLeft" && cur > 0) show(cur === 1 ? "home" : cur - 1, "push");
});

document.getElementById("bReset").onclick = () => {
  if (!confirm("Desmarcar todos os itens do checklist?")) return;
  DATA.forEach(s => s.check.forEach((_, j) => delete state[s.id + "." + j]));
  document.querySelectorAll('input[type="checkbox"]').forEach(i => i.checked = false);
  save(); refresh();
};

document.getElementById("bPr").onclick = () => window.print();
window.addEventListener("beforeprint", () => {
  document.querySelectorAll("details").forEach(d => { d.dataset.was = d.open ? "1" : ""; d.open = true; });
});
window.addEventListener("afterprint", () => {
  document.querySelectorAll("details").forEach(d => { d.open = d.dataset.was === "1"; });
});

const TEMAS = { "": "sistema", light: "claro", dark: "escuro" };
function aplicaTema(t) {
  const v = TEMAS[t] === undefined ? "" : t;
  v ? document.documentElement.setAttribute("data-theme", v)
    : document.documentElement.removeAttribute("data-theme");
  const b = document.getElementById("bTh");
  b.setAttribute("aria-label", "Tema: " + TEMAS[v] + ". Alternar.");
  b.title = "Tema: " + TEMAS[v];
  state.theme = v;
}
document.getElementById("bTh").onclick = () => {
  const now = document.documentElement.getAttribute("data-theme");
  aplicaTema(now === "dark" ? "light" : now === "light" ? "" : "dark");
  save();
};

document.getElementById("bExp").onclick = () => {
  const L = ["# Checklist de aplicação de collab", ""];
  DATA.forEach(s => {
    L.push("## Etapa " + s.id + " · " + s.nome, "_Avança quando: " + s.gate + "_", "");
    s.check.forEach((c, j) => L.push((state[s.id + "." + j] ? "- [x] " : "- [ ] ") + c));
    L.push("");
  });
  L.push("Fonte: Quadro 5 da dissertação de Douglas R. Bocalão · MPA FGV EAESP.");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([L.join("\n")], { type: "text/markdown" }));
  a.download = "checklist-collab.md"; a.click(); URL.revokeObjectURL(a.href);
};

aplicaTema(state.theme || "");
const h = location.hash;
const inicial = parseHash();
show(inicial !== null ? inicial : (state.last || "home"), "replace");
refresh();
</script>

</html>
